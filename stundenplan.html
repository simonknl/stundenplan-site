<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · IFB</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  --bg:#fafbfc;--surface:#ffffff;--surface-2:#f5f6f8;--border:#e1e4e8;--border-s:#eeeff2;
  --text:#1a202c;--text-2:#4a5568;--muted:#6b7280;--subtle:#9ca3af;--blue:#2563eb;
  --success:#059669;--warning:#d97706;--error:#dc2626;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 8px 24px rgba(0,0,0,.12);
  --r-sm:4px;--r-md:6px;--r-lg:8px;
  --sp-xs:4px;--sp-sm:6px;--sp-md:10px;--sp-lg:16px;--sp-xl:24px;--sp-2xl:32px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:14px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:20px;
}
[data-theme="dark"] {
  --bg:#0a0e27;--surface:#161b27;--surface-2:#1c2333;--border:#2d3748;--border-s:#1e2a3a;
  --text:#e2e8f0;--text-2:#a0aec0;--muted:#9ca3af;--subtle:#6b7280;--blue:#3b82f6;
  --success:#10b981;--warning:#f59e0b;--error:#f87171;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow:0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;font-size:var(--fs-base);line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.page{max-width:1200px;margin:0 auto;padding:var(--sp-lg)}
@media(min-width:768px){.page{padding:var(--sp-xl) var(--sp-2xl)}}

/* header */
.header{display:flex;align-items:center;gap:var(--sp-lg);margin-bottom:var(--sp-lg);flex-wrap:wrap}
.header-title{flex:1;min-width:160px}
.header-title h1{font-size:var(--fs-2xl);font-weight:900;letter-spacing:-.5px;line-height:1.2}
.header-title .sub{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-xs)}
.header-actions{display:flex;align-items:center;gap:var(--sp-md)}
.clock-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-md) var(--sp-lg);text-align:right;box-shadow:none}
.clock-time{font-size:var(--fs-xl);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.clock-date{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-xs)}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background 150ms,color 150ms;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.back-link{display:flex;align-items:center;gap:var(--sp-xs);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0 var(--sp-md);height:36px;font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-decoration:none;transition:background 150ms,color 150ms;white-space:nowrap}
.back-link:hover{background:var(--surface-2);color:var(--text);text-decoration:none}

/* class tabs */
.class-tabs{display:flex;gap:var(--sp-sm);margin-bottom:var(--sp-lg);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-sm);box-shadow:none;flex-wrap:wrap}
.ct-btn{flex:1;min-width:60px;padding:var(--sp-md) var(--sp-md);border:none;border-radius:var(--r-md);background:transparent;color:var(--muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:background 150ms,color 150ms;font-family:inherit;white-space:nowrap}
.ct-btn:hover{background:var(--surface-2);color:var(--text)}
.ct-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.2)}
[data-theme="dark"] .ct-btn.active{box-shadow:0 2px 6px rgba(59,130,246,.15)}

/* lesson banner - NO GRADIENTS */
.lesson-banner{border-radius:var(--r-lg);padding:var(--sp-lg) var(--sp-xl);color:#fff;display:flex;align-items:center;gap:var(--sp-lg);margin-bottom:var(--sp-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.lesson-banner.active{background:#2563eb}
.lesson-banner.free{background:#6b7280}
.lesson-banner.break-time{background:#0891b2}
.lesson-banner.done{background:#059669}
.lesson-banner.hidden{display:none}
.lb-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);flex-shrink:0;animation:lpulse 1.8s ease-in-out infinite}
@keyframes lpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.lb-info{flex:1;min-width:0}
.lb-eyebrow{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:none;opacity:.85;margin-bottom:var(--sp-xs)}
.lb-subject{font-size:var(--fs-lg);font-weight:700}
.lb-detail{font-size:var(--fs-xs);opacity:.75;margin-top:var(--sp-xs)}
.lb-prog-track{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:var(--sp-md);overflow:hidden}
.lb-prog-bar{height:100%;background:rgba(255,255,255,.85);border-radius:2px;transition:width .5s ease}
.lb-right{text-align:right;flex-shrink:0}
.lb-count{font-size:var(--fs-2xl);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.lb-count-lbl{font-size:var(--fs-xs);opacity:.7;text-transform:none;letter-spacing:.06em;margin-top:var(--sp-xs)}

/* layout */
.layout{display:flex;flex-direction:column;gap:16px}
@media(min-width:960px){.layout{flex-direction:row;align-items:flex-start}.main-col{flex:1;min-width:0}.side-col{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}}
.side-mob{display:flex;flex-direction:column;gap:16px;margin-top:16px}
@media(min-width:960px){.side-mob{display:none}}
.side-col{display:none}
@media(min-width:960px){.side-col{display:flex}}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:none;overflow:hidden}
.card-head{padding:var(--sp-lg) var(--sp-xl) var(--sp-md);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-md)}
.card-head h2{font-size:var(--fs-sm);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--muted);flex:1}
.card-head .chi{color:var(--subtle)}

/* timetable */
.tt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:var(--sp-md) var(--sp-lg) var(--sp-lg)}
.tt-grid{display:grid;grid-template-columns:50px repeat(5,1fr);gap:3px;min-width:460px}
.tt-hdr{padding:var(--sp-sm) var(--sp-xs);text-align:center;font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.05em}
.tt-hdr.td{color:var(--blue)}
.tt-hdr-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);margin:3px auto 0}
.tt-time{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-xs) var(--sp-sm);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--subtle);text-align:center;line-height:1.3}
.tt-pn{font-size:var(--fs-xs);font-weight:700;color:var(--subtle);letter-spacing:.04em;margin-bottom:var(--sp-xs)}
.tt-brk{grid-column:1/-1;display:flex;align-items:center;height:9px}
.tt-brk-line{flex:1;height:1px;background:var(--border-s)}
.tt-cell{border-radius:var(--r-md);padding:var(--sp-md) var(--sp-md);min-height:48px;display:flex;flex-direction:column;justify-content:center;position:relative;transition:transform 150ms,box-shadow 150ms;cursor:default}
.tt-cell.emp{background:transparent}
.tt-cell:not(.emp){background:var(--sc-bg);border:1px solid var(--sc-brd);cursor:pointer}
.tt-cell:not(.emp):hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(0,0,0,.08);z-index:1}
.tt-cell.td:not(.emp){filter:brightness(1.05)}
[data-theme="dark"] .tt-cell.td:not(.emp){filter:brightness(1.12)}
.tt-cell.now{box-shadow:0 0 0 2px var(--sc)!important;animation:aglow 2s ease-in-out infinite alternate}
@keyframes aglow{from{box-shadow:0 0 0 2px var(--sc)}to{box-shadow:0 0 0 2px var(--sc),0 0 10px rgba(99,102,241,.2)}}
.tt-cell .cs{font-size:var(--fs-sm);font-weight:700;color:var(--sc-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-cell .ct{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-cell .cr{position:absolute;top:4px;right:5px;font-size:var(--fs-xs);font-weight:600;color:var(--subtle);background:var(--surface);border-radius:3px;padding:1px 4px;border:1px solid var(--border)}
.gf{border-radius:var(--r-md) var(--r-md) 3px 3px}
.gm{border-radius:3px;border-top:1px solid transparent!important;margin-top:-1px}
.gl{border-radius:3px 3px var(--r-md) var(--r-md);border-top:1px solid transparent!important;margin-top:-1px}

/* subject colors - muted, sophisticated palette */
.sc-java   {--sc:#7c3aed;--sc-bg:rgba(124,58,237,.12);--sc-brd:rgba(124,58,237,.25);--sc-text:#5b21b6}
.sc-linux  {--sc:#0891b2;--sc-bg:rgba(8,145,178,.12);--sc-brd:rgba(8,145,178,.25);--sc-text:#164e63}
.sc-acc    {--sc:#a855f7;--sc-bg:rgba(168,85,247,.12);--sc-brd:rgba(168,85,247,.25);--sc-text:#6b21a8}
.sc-bwl    {--sc:#1e40af;--sc-bg:rgba(30,64,175,.12);--sc-brd:rgba(30,64,175,.25);--sc-text:#1e3a8a}
.sc-rewe   {--sc:#be123c;--sc-bg:rgba(190,18,60,.12);--sc-brd:rgba(190,18,60,.25);--sc-text:#80072f}
.sc-orga   {--sc:#0d9488;--sc-bg:rgba(13,148,136,.12);--sc-brd:rgba(13,148,136,.25);--sc-text:#134e4a}
.sc-e      {--sc:#b45309;--sc-bg:rgba(180,83,9,.12);--sc-brd:rgba(180,83,9,.25);--sc-text:#78350f}
.sc-ma     {--sc:#7c2d12;--sc-bg:rgba(124,45,18,.12);--sc-brd:rgba(124,45,18,.25);--sc-text:#5a1d0c}
.sc-dv     {--sc:#4f46e5;--sc-bg:rgba(79,70,229,.12);--sc-brd:rgba(79,70,229,.25);--sc-text:#312e81}
.sc-web    {--sc:#0369a1;--sc-bg:rgba(3,105,161,.12);--sc-brd:rgba(3,105,161,.25);--sc-text:#082f49}
.sc-pug    {--sc:#65a30d;--sc-bg:rgba(101,163,13,.12);--sc-brd:rgba(101,163,13,.25);--sc-text:#3a5f0b}
.sc-py     {--sc:#15803d;--sc-bg:rgba(21,128,61,.12);--sc-brd:rgba(21,128,61,.25);--sc-text:#14532d}
.sc-exc    {--sc:#92400e;--sc-bg:rgba(146,64,14,.12);--sc-brd:rgba(146,64,14,.25);--sc-text:#54381a}
.sc-ki     {--sc:#6d28d9;--sc-bg:rgba(109,40,217,.12);--sc-brd:rgba(109,40,217,.25);--sc-text:#3f0f5c}
.sc-wima   {--sc:#9f1239;--sc-bg:rgba(159,18,57,.12);--sc-brd:rgba(159,18,57,.25);--sc-text:#500724}
.sc-inv    {--sc:#0c4a6e;--sc-bg:rgba(12,74,110,.12);--sc-brd:rgba(12,74,110,.25);--sc-text:#082f49}
.sc-voc    {--sc:#b45309;--sc-bg:rgba(180,83,9,.12);--sc-brd:rgba(180,83,9,.25);--sc-text:#78350f}
.sc-sql    {--sc:#0891b2;--sc-bg:rgba(8,145,178,.12);--sc-brd:rgba(8,145,178,.25);--sc-text:#164e63}
.sc-geo    {--sc:#57534e;--sc-bg:rgba(87,83,78,.12);--sc-brd:rgba(87,83,78,.25);--sc-text:#3f3633}
.sc-phy    {--sc:#6d28d9;--sc-bg:rgba(109,40,217,.12);--sc-brd:rgba(109,40,217,.25);--sc-text:#3f0f5c}
.sc-sowe   {--sc:#65a30d;--sc-bg:rgba(101,163,13,.12);--sc-brd:rgba(101,163,13,.25);--sc-text:#3a5f0b}
.sc-zzz    {--sc:#6b7280;--sc-bg:rgba(107,114,128,.1);--sc-brd:rgba(107,114,128,.2);--sc-text:#4b5563}
[data-theme="dark"] .sc-java  {--sc-bg:rgba(124,58,237,.15);--sc-brd:rgba(124,58,237,.3);--sc-text:#d8b4fe}
[data-theme="dark"] .sc-linux {--sc-bg:rgba(8,145,178,.15);--sc-brd:rgba(8,145,178,.3);--sc-text:#67e8f9}
[data-theme="dark"] .sc-acc   {--sc-bg:rgba(168,85,247,.15);--sc-brd:rgba(168,85,247,.3);--sc-text:#d8b4fe}
[data-theme="dark"] .sc-bwl   {--sc-bg:rgba(30,64,175,.15);--sc-brd:rgba(30,64,175,.3);--sc-text:#93c5fd}
[data-theme="dark"] .sc-rewe  {--sc-bg:rgba(190,18,60,.15);--sc-brd:rgba(190,18,60,.3);--sc-text:#fda4af}
[data-theme="dark"] .sc-orga  {--sc-bg:rgba(13,148,136,.15);--sc-brd:rgba(13,148,136,.3);--sc-text:#5eead4}
[data-theme="dark"] .sc-e     {--sc-bg:rgba(180,83,9,.15);--sc-brd:rgba(180,83,9,.3);--sc-text:#fdba74}
[data-theme="dark"] .sc-ma    {--sc-bg:rgba(124,45,18,.15);--sc-brd:rgba(124,45,18,.3);--sc-text:#fb923c}
[data-theme="dark"] .sc-dv    {--sc-bg:rgba(79,70,229,.15);--sc-brd:rgba(79,70,229,.3);--sc-text:#a5b4fc}
[data-theme="dark"] .sc-web   {--sc-bg:rgba(3,105,161,.15);--sc-brd:rgba(3,105,161,.3);--sc-text:#06b6d4}
[data-theme="dark"] .sc-pug   {--sc-bg:rgba(101,163,13,.15);--sc-brd:rgba(101,163,13,.3);--sc-text:#bef264}
[data-theme="dark"] .sc-py    {--sc-bg:rgba(21,128,61,.15);--sc-brd:rgba(21,128,61,.3);--sc-text:#86efac}
[data-theme="dark"] .sc-exc   {--sc-bg:rgba(146,64,14,.15);--sc-brd:rgba(146,64,14,.3);--sc-text:#fdba74}
[data-theme="dark"] .sc-ki    {--sc-bg:rgba(109,40,217,.15);--sc-brd:rgba(109,40,217,.3);--sc-text:#d8b4fe}
[data-theme="dark"] .sc-wima  {--sc-bg:rgba(159,18,57,.15);--sc-brd:rgba(159,18,57,.3);--sc-text:#fda4af}
[data-theme="dark"] .sc-inv   {--sc-bg:rgba(12,74,110,.15);--sc-brd:rgba(12,74,110,.3);--sc-text:#7dd3fc}
[data-theme="dark"] .sc-voc   {--sc-bg:rgba(180,83,9,.15);--sc-brd:rgba(180,83,9,.3);--sc-text:#fdba74}
[data-theme="dark"] .sc-sql   {--sc-bg:rgba(8,145,178,.15);--sc-brd:rgba(8,145,178,.3);--sc-text:#67e8f9}
[data-theme="dark"] .sc-geo   {--sc-bg:rgba(87,83,78,.15);--sc-brd:rgba(87,83,78,.3);--sc-text:#d6d3d1}
[data-theme="dark"] .sc-phy   {--sc-bg:rgba(109,40,217,.15);--sc-brd:rgba(109,40,217,.3);--sc-text:#d8b4fe}
[data-theme="dark"] .sc-sowe  {--sc-bg:rgba(101,163,13,.15);--sc-brd:rgba(101,163,13,.3);--sc-text:#bef264}
[data-theme="dark"] .sc-zzz   {--sc-bg:rgba(107,114,128,.12);--sc-brd:rgba(107,114,128,.25);--sc-text:#d1d5db}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-xs) var(--sp-lg);padding:0 var(--sp-xl) var(--sp-md)}
.lg-item{display:flex;align-items:center;gap:var(--sp-xs);font-size:var(--fs-xs);color:var(--muted)}
.lg-dot{width:7px;height:7px;border-radius:50%;background:var(--sc);flex-shrink:0}

/* next exam */
.nex-body{padding:var(--sp-lg) var(--sp-xl)}
.nex-ey{font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--subtle);margin-bottom:var(--sp-md)}
.nex-subj{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px}
.nex-date{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-md)}
.nex-badge{display:inline-flex;align-items:center;border-radius:999px;padding:var(--sp-xs) var(--sp-lg);font-size:var(--fs-sm);font-weight:700;margin-top:var(--sp-lg)}
.nb-today{background:#fee2e2;color:#dc2626}.nb-soon{background:#fef3c7;color:#d97706}
.nb-norm{background:#eff6ff;color:#2563eb}.nb-ap{background:#f0fdf4;color:#059669}
[data-theme="dark"] .nb-today{background:#450a0a;color:#f87171}
[data-theme="dark"] .nb-soon{background:#451a03;color:#fbbf24}
[data-theme="dark"] .nb-norm{background:#172554;color:#93c5fd}
[data-theme="dark"] .nb-ap{background:#052e16;color:#4ade80}

/* today list */
.tod-empty{padding:var(--sp-lg) var(--sp-xl);font-size:var(--fs-sm);color:var(--muted);text-align:center}
.tod-item{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-xl);border-top:1px solid var(--border-s)}
.tod-item:first-child{border-top:none}
.tod-item.now{background:var(--border-s)}
.ti-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);flex-shrink:0}
.ti-time{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--muted);width:76px;flex-shrink:0}
.ti-subj{font-size:var(--fs-sm);font-weight:600;color:var(--sc-text);flex:1}
.ti-teach{font-size:var(--fs-xs);color:var(--muted)}
.ti-now-tag{font-size:var(--fs-xs);font-weight:700;background:var(--blue);color:#fff;border-radius:999px;padding:1px 7px;flex-shrink:0}

/* exam list */
.ex-mhdr{padding:var(--sp-md) var(--sp-xl) var(--sp-xs);font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--subtle);background:var(--surface-2);border-top:1px solid var(--border)}
.ex-mhdr:first-child{border-top:none}
.ex-row{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-xl);border-top:1px solid var(--border-s);transition:background 150ms}
.ex-row:hover{background:var(--surface-2)}
.ex-row.past{opacity:.35}
.ex-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);flex-shrink:0}
.ex-date{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--muted);width:64px;flex-shrink:0}
.ex-subj{flex:1;font-weight:600;font-size:var(--fs-sm);color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-badge{font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:2px 8px;flex-shrink:0}
.eb-today{background:#fee2e2;color:#dc2626}
.eb-soon{background:#fef3c7;color:#d97706}
.eb-fut{background:#f1f5f9;color:#64748b}
.eb-ap{background:#eff6ff;color:#2563eb}
.eb-zg{background:#f0fdf4;color:#059669}
[data-theme="dark"] .eb-today{background:#450a0a;color:#f87171}
[data-theme="dark"] .eb-soon{background:#451a03;color:#fbbf24}
[data-theme="dark"] .eb-fut{background:#1e293b;color:#64748b}
[data-theme="dark"] .eb-ap{background:#172554;color:#93c5fd}
[data-theme="dark"] .eb-zg{background:#052e16;color:#4ade80}
.ex-empty{padding:20px 18px;text-align:center;font-size:13px;color:var(--muted)}
/* feat: subject highlight */
.tt-cell.subj-hi{outline:2px solid var(--sc);outline-offset:-2px;z-index:2;filter:brightness(1.12)}
.tt-cell.subj-dim{opacity:.28}
#cellTip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-md) var(--sp-lg);box-shadow:var(--shadow);font-size:var(--fs-sm);z-index:1000;min-width:150px;max-width:230px;display:none}
#cellTip.vis{display:block}
.ctp-name{font-size:var(--fs-sm);font-weight:700;margin-bottom:var(--sp-md)}
.ctp-row{color:var(--muted);margin-top:var(--sp-md);font-size:var(--fs-xs)}
/* feat: gap indicator in today list */
.tod-gap{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-xl);border-top:1px solid var(--border-s);color:var(--muted);font-size:var(--fs-sm)}
.tod-gap-dot{width:8px;height:8px;border-radius:50%;background:var(--subtle);flex-shrink:0}
/* feat: ferien divider in exam list */
.ex-ferien{padding:var(--sp-md) var(--sp-xl);font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:#059669;background:#f0fdf4;border-top:1px solid #bbf7d0}
[data-theme="dark"] .ex-ferien{color:#4ade80;background:#052e16;border-color:#166534}
/* quicklinks */
.ql-item{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-lg) var(--sp-lg);border-top:1px solid var(--border-s);text-decoration:none;transition:background 150ms;color:inherit}
.ql-item:first-child{border-top:none}
.ql-item:hover{background:var(--surface-2);text-decoration:none}
.ql-icon{width:32px;height:32px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sc-bg);border:1px solid var(--sc-brd);color:var(--sc-text)}
.ql-text{flex:1;min-width:0}
.ql-name{font-size:var(--fs-sm);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql-url{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql-arrow{color:var(--subtle);flex-shrink:0}
footer{text-align:center;padding:var(--sp-xl) 0 var(--sp-lg);font-size:var(--fs-xs);color:var(--subtle)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}
</style>

  {name:'Faschingsferien', s:'2026-02-16', e:'2026-02-20'},
  {name:'Osterferien',     s:'2026-03-30', e:'2026-04-11'},
  {name:'Pfingstferien',   s:'2026-05-30', e:'2026-06-13'},
  {name:'Sommerferien',    s:'2026-07-30', e:'2026-09-14'},
];

// ─── HELPERS ──────────────────────────────────────────────────────────────────

const p2=n=>String(n).padStart(2,'0');
function nowM(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function todayDI(){const d=new Date().getDay();return d===0||d===6?-1:d-1}
const DWS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DWK=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MNS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function fmtTime(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function fmtDate(d){return DWS[d.getDay()]+', '+d.getDate()+'. '+MNS[d.getMonth()]+' '+d.getFullYear()}
function fmtDateShort(d){return DWK[d.getDay()]+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'}
function parseD(s){const[y,m,dy]=s.split('-').map(Number);return new Date(y,m-1,dy)}
function todayMid(){const d=new Date();d.setHours(0,0,0,0);return d}
function daysUntil(s){return Math.round((parseD(s)-todayMid())/86400000)}
function mHM(m){const h=Math.floor(m/60),mm=m%60;return h>0?h+'h '+p2(mm)+'m':mm+' min'}

// ─── STATE ────────────────────────────────────────────────────────────────────

let isDark = localStorage.getItem('sp-theme')==='dark';
let selCls = localStorage.getItem('sp-class')||'info1';

document.getElementById('themeBtn').addEventListener('click',()=>{

// ─── TIMETABLE ────────────────────────────────────────────────────────────────

function renderTT(){
  const grid=document.getElementById('ttGrid');
  const dayIdx=todayDI();
  const nm=nowM();
  let currP=-1;
  for(let i=0;i<PERIODS.length;i++)if(nm>=PERIODS[i].sm&&nm<PERIODS[i].em&&dayIdx>=0)currP=i;
  const sched=SCHED[selCls];
  const cls=CLASSES.find(c=>c.id===selCls);

  document.getElementById('ttTitle').textContent='Wochenplan — '+cls.name;
  document.getElementById('headerSub').textContent=cls.name+' · '+cls.room+' · ab 09. März 2026';

  const E=(tag,cls2,html)=>{const e=document.createElement(tag);if(cls2)e.className=cls2;if(html!=null)e.innerHTML=html;return e};
  grid.innerHTML='';
  grid.appendChild(E('div','tt-hdr',''));
  for(let di=0;di<5;di++){
    const h=E('div','tt-hdr'+(di===dayIdx?' td':''),['Mo','Di','Mi','Do','Fr'][di]);
    if(di===dayIdx){const d=document.createElement('div');d.className='tt-hdr-dot';h.appendChild(d);}
    grid.appendChild(h);
  }
  for(let pi=0;pi<PERIODS.length;pi++){
    if(BRK.has(pi)){const br=E('div','tt-brk','');br.appendChild(E('div','tt-brk-line',''));grid.appendChild(br);}
    const p=PERIODS[pi];
    grid.appendChild(E('div','tt-time',`<span class="tt-pn">${p.n}.</span>${p.s}<br>${p.e}`));
    for(let di=0;di<5;di++){
      const l=sched[di][pi];
      if(!l){grid.appendChild(E('div','tt-cell emp',''));continue;}
      const m=sm(l.s);
      let cls2=`tt-cell ${m.c}`;
      if(di===dayIdx)cls2+=' td';
      if(di===dayIdx&&pi===currP)cls2+=' now';
      const pl=pi>0?sched[di][pi-1]:null;
      const nl=pi<8?sched[di][pi+1]:null;
      const cp=pl&&pl.s===l.s&&!BRK.has(pi);
      const cn=nl&&nl.s===l.s&&!BRK.has(pi+1);
      if(cp&&cn)cls2+=' gm';else if(cp)cls2+=' gl';else if(cn)cls2+=' gf';
      const cell=E('div',cls2,'');
      cell.dataset.subj=l.s;
      cell._lesson=l;
      cell._pi=pi;
      if(!cp){cell.innerHTML=`<div class="cs">${m.d}</div><div class="ct">${l.t}</div>`;}
      else{cell.innerHTML=`<div class="cs" style="opacity:.35">···</div>`;}
      if(l.r)cell.appendChild(E('div','cr',l.r));
      grid.appendChild(cell);
    }
  }
  if(activeSubj)highlightSubj(activeSubj);
}

// ─── LEGEND ───────────────────────────────────────────────────────────────────

function renderLegend(){
  const used=new Set();
  for(const day of SCHED[selCls])for(const l of day)if(l)used.add(l.s);
  const leg=document.getElementById('legend');
  leg.innerHTML='';
  for(const s of used){
    const m=sm(s);
    const it=document.createElement('div');
    it.className=`lg-item ${m.c}`;
    it.innerHTML=`<div class="lg-dot"></div>${m.l}`;
    leg.appendChild(it);
  }
}

// ─── BANNER ───────────────────────────────────────────────────────────────────

function updateBanner(){
  const bn=document.getElementById('banner');
  const nm=nowM(),di=todayDI();
  if(di<0){bn.className='lesson-banner hidden';return;}
  const sched=SCHED[selCls];
  for(let i=0;i<PERIODS.length;i++){
    const p=PERIODS[i];
    if(nm>=p.sm&&nm<p.em){
      const l=sched[di][i];
      const prog=((nm-p.sm)/(p.em-p.sm)*100).toFixed(1);
      const ml=p.em-nm;
      if(l){
        const m=sm(l.s);
        bn.className='lesson-banner active';
        document.getElementById('lbEy').textContent=p.n+'. Stunde · '+p.s+' – '+p.e;
        document.getElementById('lbSubj').textContent=m.l;
        document.getElementById('lbDet').textContent=l.t+(l.r?' · '+l.r:'');
        document.getElementById('lbBar').style.width=prog+'%';
        document.getElementById('lbCount').textContent=mHM(ml);
        document.getElementById('lbCountLbl').textContent='verbleibend';
      } else {
        bn.className='lesson-banner free';
        document.getElementById('lbEy').textContent=p.n+'. Stunde · '+p.s+' – '+p.e;
        document.getElementById('lbSubj').textContent='Freistunde';
        document.getElementById('lbDet').textContent='Keine Unterrichtseinheit';
        document.getElementById('lbBar').style.width=prog+'%';
        document.getElementById('lbCount').textContent=mHM(ml);
        document.getElementById('lbCountLbl').textContent='bis Ende';
      }
      return;
    }
  }
  for(const[idx,bsm,bem]of BREAKS){
    if(nm>=bsm&&nm<bem){
      bn.className='lesson-banner break-time';
      document.getElementById('lbEy').textContent='Pause';
      document.getElementById('lbSubj').textContent='Pause · '+bsm/60|0+':'+p2(bsm%60)+' – '+bem/60|0+':'+p2(bem%60);
      document.getElementById('lbDet').textContent='Weiter um '+PERIODS[idx].s+' Uhr';
      document.getElementById('lbBar').style.width=((nm-bsm)/(bem-bsm)*100).toFixed(1)+'%';
      document.getElementById('lbCount').textContent=mHM(bem-nm);
      document.getElementById('lbCountLbl').textContent='bis Unterricht';
      return;
    }
  }
  if(nm<PERIODS[0].sm){
    bn.className='lesson-banner break-time';
    document.getElementById('lbEy').textContent='Vor Schulbeginn';
    document.getElementById('lbSubj').textContent='Schulbeginn um 08:00 Uhr';
    document.getElementById('lbDet').textContent=DWS[new Date().getDay()];
    document.getElementById('lbBar').style.width='0%';
    document.getElementById('lbCount').textContent=mHM(PERIODS[0].sm-nm);
    document.getElementById('lbCountLbl').textContent='bis Schulbeginn';
    return;
  }
  if(nm>=PERIODS[PERIODS.length-1].em){
    bn.className='lesson-banner done';
    document.getElementById('lbEy').textContent='Schultag beendet';
    document.getElementById('lbSubj').textContent='Schulschluss — guter Abend!';
    document.getElementById('lbDet').textContent='Morgen wieder ab 08:00 Uhr';
    document.getElementById('lbBar').style.width='100%';
    document.getElementById('lbCount').textContent='✓';
    document.getElementById('lbCountLbl').textContent='Feierabend';
    return;
  }
  bn.className='lesson-banner hidden';
}

// ─── NEXT EXAM ────────────────────────────────────────────────────────────────

function renderNex(){
  const exams=EXAMS[selCls];
  function build(id){
    const el=document.getElementById(id);
    if(!exams){el.innerHTML='<div class="tod-empty">Kein Klausurenplan für diese Klasse verfügbar</div>';return;}
    const today=todayMid();
    let next=null;
    for(const ex of exams){const d=parseD(ex.date);if(d>=today){next={...ex,days:daysUntil(ex.date)};break;}}
    if(!next){el.innerHTML='<div class="tod-empty">Keine weiteren Klausuren</div>';return;}
    const m=sm(next.s);
    const d=parseD(next.date);
    let bc,bt;
    if(next.t==='Zeugnis'){bc='nb-ap';bt='Zeugnis';}
    else if(next.t==='AP'){bc='nb-ap';bt='AP';}
    else if(next.days===0){bc='nb-today';bt='HEUTE';}
    else if(next.days===1){bc='nb-soon';bt='Morgen';}
    else if(next.days<=4){bc='nb-soon';bt='in '+next.days+' Tagen';}
    else{bc='nb-norm';bt='in '+next.days+' Tagen';}
    el.innerHTML=`<div class="nex-body"><div class="nex-ey">${next.t}</div><div class="nex-subj ${m.c}" style="color:var(--sc-text)">${next.l}</div><div class="nex-date">${DWS[d.getDay()]}, ${d.getDate()}. ${MN[d.getMonth()]} ${d.getFullYear()}</div><div class="nex-badge ${bc}">${bt}</div></div>`;
  }
  build('nexBody');build('nexBodyMob');
}

// ─── TODAY LIST ───────────────────────────────────────────────────────────────

function renderToday(){
  const di=todayDI(),nm=nowM();
  const sched=SCHED[selCls];
  function build(lid,tid){
    const le=document.getElementById(lid),te=document.getElementById(tid);
    if(!le)return;
    if(di<0){if(te)te.textContent='Wochenende';le.innerHTML='<div class="tod-empty">Kein Unterricht</div>';return;}
    // build lesson blocks
    const blocks=[];
    for(let pi=0;pi<PERIODS.length;pi++){
      const l=sched[di][pi];
      if(!l)continue;
      const pl=pi>0?sched[di][pi-1]:null;
      if(pl&&pl.s===l.s&&!BRK.has(pi))continue;
      let lpi=pi;
      for(let j=pi+1;j<PERIODS.length;j++){if(!BRK.has(j)&&sched[di][j]&&sched[di][j].s===l.s)lpi=j;else break;}
      blocks.push({l,pi,lpi});
    }
    // remaining lessons (not yet ended)
    const rem=blocks.filter(b=>PERIODS[b.lpi].em>nm).length;
    if(te)te.textContent=DWS[di+1]+(rem>0?' · noch '+rem+' Std.':'');
    if(!blocks.length){le.innerHTML='<div class="tod-empty">Kein Unterricht heute</div>';return;}
    let html='';
    for(let i=0;i<blocks.length;i++){
      const{l,pi,lpi}=blocks[i];
      const ps=PERIODS[pi],pe=PERIODS[lpi];
      const isNow=(nm>=ps.sm&&nm<pe.em);
      const m=sm(l.s);
      // gap indicator between consecutive blocks
      if(i>0&&pi>blocks[i-1].lpi+1){
        const gs=PERIODS[blocks[i-1].lpi+1].s,ge=PERIODS[pi-1].e;
        html+=`<div class="tod-gap"><div class="tod-gap-dot"></div><div class="ti-time">${gs}–${ge}</div><div style="flex:1;font-style:italic">Freistunde</div></div>`;
      }
      html+=`<div class="tod-item${isNow?' now':''} ${m.c}"><div class="ti-dot"></div><div class="ti-time">${ps.s}–${pe.e}</div><div class="ti-subj">${m.l}</div><div class="ti-teach">${l.t}${l.r?' · '+l.r:''}</div>${isNow?'<div class="ti-now-tag">jetzt</div>':''}</div>`;
    }
    le.innerHTML=html;
  }
  build('todayList','todayTitle');build('todayListMob','todayTitleMob');
}

// ─── EXAM LIST ────────────────────────────────────────────────────────────────

function renderExams(){
  const exams=EXAMS[selCls];
  const el=document.getElementById('examList');
  if(!exams){el.innerHTML='<div class="ex-empty">Klausurenplan für diese Klasse nicht verfügbar</div>';return;}
  const today=todayMid();
  let html='',curM='',feriIdx=0,prevD=null;
  for(const ex of exams){
    const d=parseD(ex.date);
    const mo=MN[d.getMonth()]+' '+d.getFullYear();
    const days=daysUntil(ex.date);
    const past=d<today;
    const m=sm(ex.s);
    if(mo!==curM){curM=mo;html+=`<div class="ex-mhdr">${mo}</div>`;}
    // ferien dividers
    while(feriIdx<FERIEN.length){
      const fs=parseD(FERIEN[feriIdx].s);
      if(fs>d)break;
      if(!prevD||fs>prevD){
        const fe=parseD(FERIEN[feriIdx].e);
        html+=`<div class="ex-ferien">☀ ${FERIEN[feriIdx].name} · bis ${fe.getDate()}. ${MNS[fe.getMonth()]}</div>`;
      }
      feriIdx++;
    }
    prevD=d;
    let bc,bt;
    if(ex.t==='Zeugnis'){bc='eb-zg';bt='Zeugnis';}
    else if(ex.t==='AP'){bc='eb-ap';bt='AP';}
    else if(past){bc='eb-fut';bt='vorbei';}
    else if(days===0){bc='eb-today';bt='HEUTE';}
    else if(days<=3){bc='eb-soon';bt=days===1?'morgen':'in '+days+' T.';}
    else{bc='eb-fut';bt='in '+days+' T.';}
    html+=`<div class="ex-row${past?' past':''} ${m.c}"><div class="ex-dot"></div><div class="ex-date">${fmtDateShort(d)}</div><div class="ex-subj">${ex.l}</div><div class="ex-badge ${bc}">${bt}</div></div>`;
  }
  el.innerHTML=html;
}

// ─── SUBJECT HIGHLIGHT ───────────────────────────────────────────────────────

let activeSubj=null;

function highlightSubj(s){
  document.querySelectorAll('.tt-cell').forEach(c=>{
    if(c.classList.contains('emp'))return;
    if(c.dataset.subj===s)c.classList.add('subj-hi');
    else c.classList.add('subj-dim');
  });
}
function clearHighlight(){
  activeSubj=null;
  document.querySelectorAll('.tt-cell').forEach(c=>c.classList.remove('subj-hi','subj-dim'));
}

document.getElementById('ttGrid').addEventListener('click',e=>{
  const cell=e.target.closest('#ttGrid .tt-cell:not(.emp)');
  if(!cell){clearHighlight();hideTip();return;}
  const subj=cell.dataset.subj;
  if(subj===activeSubj){clearHighlight();hideTip();return;}
  clearHighlight();
  activeSubj=subj;
  highlightSubj(subj);
  showTip(cell,cell._lesson,cell._pi);
});

document.addEventListener('click',e=>{
  if(!e.target.closest('#ttGrid')&&!e.target.closest('#cellTip')){
    clearHighlight();hideTip();
  }
});

// ─── TOOLTIP ──────────────────────────────────────────────────────────────────

function showTip(cell,l,pi){
  const tip=document.getElementById('cellTip');
  const m=sm(l.s);
  const p=PERIODS[pi];
  const cls=CLASSES.find(c=>c.id===selCls);
  const room=l.r||cls.room;
  tip.innerHTML=`<div class="ctp-name ${m.c}" style="color:var(--sc-text)">${m.l}</div>
<div class="ctp-row">Lehrer · ${l.t||'–'}</div>
<div class="ctp-row">Raum · ${room}</div>
<div class="ctp-row">Zeit · ${p.s} – ${p.e}</div>`;
  const rect=cell.getBoundingClientRect();
  let left=rect.right+8,top=rect.top;
  if(left+230>window.innerWidth-10)left=rect.left-238;
  if(left<8)left=8;
  if(top+110>window.innerHeight-10)top=window.innerHeight-120;
  tip.style.left=left+'px';
  tip.style.top=top+'px';
  tip.classList.add('vis');
}
function hideTip(){document.getElementById('cellTip').classList.remove('vis');}

// ─── ICAL EXPORT ──────────────────────────────────────────────────────────────

function exportIcal(){
  const cls=CLASSES.find(c=>c.id===selCls);
  const sched=SCHED[selCls];
  // Monday of current week (or next if weekend)
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  let monday=new Date(today);
  if(dow===0)monday.setDate(today.getDate()+1);
  else if(dow===6)monday.setDate(today.getDate()+2);
  else monday.setDate(today.getDate()-(dow-1));
  function idt(d,ts){
    const[h,m]=ts.split(':').map(Number);
    return`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(h)}${p2(m)}00`;
  }
  const events=[];
  for(let di=0;di<5;di++){
    const dd=new Date(monday);dd.setDate(monday.getDate()+di);
    for(let pi=0;pi<PERIODS.length;pi++){
      const l=sched[di][pi];
      if(!l)continue;
      const pl=pi>0?sched[di][pi-1]:null;
      if(pl&&pl.s===l.s&&!BRK.has(pi))continue;
      let lpi=pi;
      for(let j=pi+1;j<PERIODS.length;j++){if(!BRK.has(j)&&sched[di][j]&&sched[di][j].s===l.s)lpi=j;else break;}
      const m=sm(l.s);
      events.push([
        'BEGIN:VEVENT',
        `UID:${selCls}-d${di}-p${pi}@IFB`,
        `DTSTART:${idt(dd,PERIODS[pi].s)}`,
        `DTEND:${idt(dd,PERIODS[lpi].e)}`,
        `SUMMARY:${m.l}`,
        `DESCRIPTION:${l.t||''}`,
        `LOCATION:${l.r||cls.room}`,
        'RRULE:FREQ=WEEKLY',
        'END:VEVENT'
      ].join('\r\n'));
    }
  }
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IFB//Stundenplan//DE',
    `X-WR-CALNAME:${cls.name} · Dashboard`,'CALSCALE:GREGORIAN',
    ...events,'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([cal],{type:'text/calendar;charset=utf-8'}));
  a.download=`stundenplan-${selCls}.ics`;
  a.click();
  URL.revokeObjectURL(a.href);
}
