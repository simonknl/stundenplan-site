<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f7a3d">
<title>Notenrechner · IFB Klassenportal</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="style.css">
<script src="scroll-header.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <div class="brand-mark">IFB</div>
      <div class="brand-text">
        <strong>Klassenportal</strong>
        <span>IFB Rosenheim</span>
      </div>
    </a>
    <div class="topbar-meta">
      <span id="clockTime">--:--:--</span>
      <a href="https://github.com/simonknl/stundenplan-site" target="_blank" rel="noopener">GitHub</a>
      <button class="icon-btn" id="themeBtn" title="Theme wechseln"><i data-lucide="moon" style="width:15px;height:15px" id="themeIcon"></i></button>
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-inner">
    <a href="index.html">Startseite</a>
    <a href="stundenplan.html">Dashboard</a>
    <a href="klausurenplan.html">Klausurenplan</a>
    <a class="active" href="notenrechner.html">Notenrechner</a>
  </div>
</div>

<div class="page medium">

<div class="page-header">
  <div class="page-header-title">
    <h1>Notenrechner</h1>
    <div class="sub">IFB Rosenheim</div>
  </div>
</div>

<div class="subject-tabs" id="subjectTabs"></div>

<div class="card">
  <div class="card-head">
    <i data-lucide="list" style="width:14px;height:14px" class="chi"></i>
    <h2 id="subjectTitle">Fach</h2>
  </div>
  <div class="preset-bar">
    <span class="preset-lbl">Hinzufügen:</span>
    <button class="preset-btn" onclick="addPreset('Schulaufgabe',2)">Schulaufgabe <span class="pw">2×</span></button>
    <button class="preset-btn" onclick="addPreset('Ex',1)">Ex <span class="pw">1×</span></button>
    <button class="preset-btn" onclick="addPreset('Mündlich',1)">Mündlich <span class="pw">1×</span></button>
    <button class="preset-btn" onclick="addPreset('Kurzarbeit',1.5)">Kurzarbeit <span class="pw">1,5×</span></button>
    <button class="preset-btn" onclick="addPreset('Referat',1)">Referat <span class="pw">1×</span></button>
  </div>
  <table class="grade-table">
    <thead>
      <tr>
        <th>Bezeichnung</th>
        <th class="tc" style="width:74px">Note</th>
        <th class="tc" style="width:70px">Gewicht</th>
        <th style="width:38px"></th>
      </tr>
    </thead>
    <tbody id="gradeBody"></tbody>
  </table>
  <div class="add-row">
    <button class="add-btn" onclick="addEntry()">
      <i data-lucide="plus" style="width:13px;height:13px"></i>
      Eintrag hinzufügen
    </button>
  </div>
  <div class="io-bar">
    <button class="io-btn" onclick="exportCSV()"><i data-lucide="download" style="width:12px;height:12px"></i> CSV</button>
    <button class="io-btn" onclick="exportPDF()"><i data-lucide="download" style="width:12px;height:12px"></i> PDF</button>
    <button class="io-btn" onclick="importCSV()"><i data-lucide="upload" style="width:12px;height:12px"></i> Import</button>
    <button class="io-btn danger" style="margin-left:auto" onclick="removeSub()"><i data-lucide="trash-2" style="width:12px;height:12px"></i> Fach löschen</button>
  </div>
</div>

<div id="resultWrap"></div>
<div id="overallResult"></div>

</div><!-- .page -->

<input type="file" id="importFile" accept=".csv" style="display:none" onchange="handleImport(event)">

<div class="modal" id="addSubjectModal">
  <div class="modal-box">
    <div class="modal-title">Neues Fach erstellen</div>
    <input type="text" class="inp modal-input" id="subjectNameInput" placeholder="z.B. Deutsch, Mathematik, Englisch...">
    <div class="modal-buttons">
      <button class="modal-btn" onclick="closeAddSubject()">Abbrechen</button>
      <button class="modal-btn primary" onclick="addSubject()">Erstellen</button>
    </div>
  </div>
</div>

<script>
// ─── GRADE SYSTEM ─────────────────────────────────────────────────────────────
const G = {'1': 1.0, '2': 2.0, '3': 3.0, '4': 4.0, '5': 5.0, '6': 6.0};
const GKEYS = ['1', '2', '3', '4', '5', '6'];

function gradeInfo(avg) {
  if (avg <= 1.5) return { label: 'sehr gut',       cls: 'rc-green'  };
  if (avg <= 2.5) return { label: 'gut',             cls: 'rc-blue'   };
  if (avg <= 3.5) return { label: 'befriedigend',    cls: 'rc-yellow' };
  if (avg <= 4.5) return { label: 'ausreichend',     cls: 'rc-orange' };
  if (avg <= 5.5) return { label: 'mangelhaft',      cls: 'rc-red'    };
  return                  { label: 'ungenügend',     cls: 'rc-red'    };
}

function fmtDE(n, d=2) { return n.toFixed(d).replace('.', ','); }
function esc(s)         { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── STATE ────────────────────────────────────────────────────────────────────
let nid = 1;
let subjects = {};
let currentSubject = null;
let isDark = localStorage.getItem('sp-theme') === 'dark';

// ─── CALC ─────────────────────────────────────────────────────────────────────
function calcAvg(entries) {
  let sum = 0, tw = 0, cnt = 0;
  for (const e of entries) {
    const g = G[e.grade];
    const w = parseFloat(e.weight);
    if (g != null && !isNaN(w) && w > 0) { sum += g * w; tw += w; cnt++; }
  }
  return tw > 0 ? { avg: sum / tw, tw, cnt } : null;
}

function calcOverall() {
  let averages = [];
  for (const [subj, entries] of Object.entries(subjects)) {
    const r = calcAvg(entries);
    if (r) averages.push(r.avg);
  }
  if (averages.length === 0) return null;
  const avg = averages.reduce((a, b) => a + b, 0) / averages.length;
  return { avg, cnt: averages.length };
}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('nr-subjects', JSON.stringify(subjects));
  localStorage.setItem('nr-current', currentSubject);
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('nr-subjects') || '{}');
    subjects = typeof s === 'object' && !Array.isArray(s) ? s : {};

    // no default subject - start empty

    for (const key in subjects) {
      if (!Array.isArray(subjects[key])) subjects[key] = [];
    }

    const ids = [];
    for (const entries of Object.values(subjects)) {
      ids.push(...entries.map(x => x.id || 0));
    }
    nid = ids.length ? Math.max(...ids) + 1 : 1;

    currentSubject = localStorage.getItem('nr-current');
    if (!currentSubject || !subjects[currentSubject]) {
      currentSubject = Object.keys(subjects)[0];
    }
  } catch {
    subjects = { 'Fach': [] };
    currentSubject = 'Fach';
  }
}

// ─── GRADE SELECT HTML ────────────────────────────────────────────────────────
function gradeSelect(val, id) {
  const opts = GKEYS.map(k => `<option value="${k}"${k===val?' selected':''}>${k}</option>`).join('');
  return `<select class="inp inp-grade" data-id="${id}" onchange="upd(${id},'grade',this.value)">${opts}</select>`;
}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function renderTabs() {
  const div = document.getElementById('subjectTabs');
  const keys = Object.keys(subjects);
  if (keys.length === 0) {
    div.innerHTML = `<button class="subject-tab create-hint" onclick="openAddSubject()"><i data-lucide="plus" style="width:13px;height:13px"></i> Fach erstellen</button>`;
    lucide.createIcons();
    return;
  }
  const tabs = keys.map(subj =>
    `<button class="subject-tab${subj === currentSubject ? ' active' : ''}" onclick="switchSubject(this.dataset.s)" data-s="${esc(subj)}">${esc(subj)}<span class="tab-del" data-del="${esc(subj)}" onclick="event.stopPropagation();removeSub(this.dataset.del)" title="Fach löschen">×</span></button>`
  ).join('');
  div.innerHTML = tabs + `<button class="subject-tab add-subject" onclick="openAddSubject()" title="Neues Fach hinzufügen"><i data-lucide="plus" style="width:14px;height:14px"></i></button>`;
  lucide.createIcons();
}

function renderGrades() {
  const tb = document.getElementById('gradeBody');
  const entries = subjects[currentSubject] || [];
  document.getElementById('subjectTitle').textContent = currentSubject || '–';

  if (!entries.length) {
    tb.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="es-title">Noch keine Einträge</div><p>Wähle einen Preset unten oder füge manuell eine Note hinzu.</p></div></td></tr>`;
    document.getElementById('resultWrap').innerHTML = '';
    return;
  }

  tb.innerHTML = entries.map(e => `
    <tr>
      <td><input class="inp inp-name" type="text" value="${esc(e.name)}" placeholder="Fach / Bezeichnung" oninput="upd(${e.id},'name',this.value)"></td>
      <td>${gradeSelect(e.grade, e.id)}</td>
      <td><input class="inp inp-w" type="number" value="${e.weight}" min="0.5" max="10" step="0.5" onchange="upd(${e.id},'weight',this.value)" oninput="upd(${e.id},'weight',this.value)"></td>
      <td><button class="del-btn" onclick="removeEntry(${e.id})" title="Löschen"><i data-lucide="x" style="width:11px;height:11px"></i></button></td>
    </tr>`).join('');
  lucide.createIcons();
  renderResult();
}

function renderResult() {
  const wrap = document.getElementById('resultWrap');
  const entries = subjects[currentSubject] || [];
  const r = calcAvg(entries);
  if (!r) { wrap.innerHTML = ''; renderOverall(); return; }
  const info = gradeInfo(r.avg);
  wrap.innerHTML = `
    <div class="result-main">
      <div class="result-label">Gewichteter Schnitt</div>
      <div class="result-val">${fmtDE(r.avg)}</div>
      <div class="result-sub">${r.cnt} Eintrag${r.cnt!==1?'e':''} &middot; Gesamtgewicht ${r.tw % 1 === 0 ? r.tw : fmtDE(r.tw)}</div>
      <div class="result-tag ${info.cls}">${info.label}</div>
    </div>`;
  renderOverall();
}

function renderOverall() {
  const div = document.getElementById('overallResult');
  const r = calcOverall();
  if (!r) { div.innerHTML = ''; return; }
  const info = gradeInfo(r.avg);
  div.innerHTML = `
    <div class="overall-mini">
      <span class="overall-mini-lbl">Gesamtschnitt</span>
      <span class="overall-mini-val">${fmtDE(r.avg)}</span>
      <span class="result-tag ${info.cls}" style="margin:0;padding:3px 10px;font-size:11px">${info.label}</span>
      <span class="overall-mini-sub">${r.cnt} ${r.cnt !== 1 ? 'Fächer' : 'Fach'}</span>
    </div>`;
}

// ─── ENTRY MUTATIONS ──────────────────────────────────────────────────────────
function newEntry(name, grade, weight) {
  return { id: nid++, name: name || '', grade: grade || '2', weight: weight || 1 };
}

function addEntry(name, grade, weight) {
  if (!currentSubject) return;
  subjects[currentSubject].push(newEntry(name, grade, weight));
  save(); renderGrades();
}

function addPreset(name, weight) {
  addEntry(name, '2', weight);
}

function removeEntry(id) {
  if (!currentSubject) return;
  subjects[currentSubject] = subjects[currentSubject].filter(e => e.id !== id);
  save(); renderGrades();
}

function upd(id, field, val) {
  if (!currentSubject) return;
  const e = subjects[currentSubject].find(e => e.id === id);
  if (!e) return;
  if (field === 'weight') { const w = parseFloat(val); if (!isNaN(w) && w > 0) e.weight = w; }
  else e[field] = val;
  save(); renderResult();
}

// ─── SUBJECT MUTATIONS ─────────────────────────────────────────────────────────
function openAddSubject() {
  document.getElementById('addSubjectModal').classList.add('active');
  document.getElementById('subjectNameInput').value = '';
  document.getElementById('subjectNameInput').focus();
}

function closeAddSubject() {
  document.getElementById('addSubjectModal').classList.remove('active');
}

function addSubject() {
  const name = document.getElementById('subjectNameInput').value.trim();
  if (!name) return;
  if (subjects[name]) { alert('Fach existiert bereits!'); return; }
  subjects[name] = [];
  save();
  switchSubject(name);
  closeAddSubject();
}

function switchSubject(name) {
  if (!subjects[name]) return;
  currentSubject = name;
  save();
  document.getElementById('subjectTitle').textContent = name;
  renderTabs();
  renderGrades();
}

function removeSub(name) {
  const target = name !== undefined ? name : currentSubject;
  if (!target || !subjects[target]) return;
  if (!confirm(`Fach "${target}" wirklich löschen?`)) return;
  delete subjects[target];
  if (currentSubject === target) currentSubject = Object.keys(subjects)[0] || null;
  save();
  renderTabs();
  if (currentSubject) switchSubject(currentSubject);
  else { renderGrades(); renderOverall(); }
}

// ─── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function exportCSV() {
  if (!currentSubject || !subjects[currentSubject].length) { alert('Keine Einträge zum Exportieren.'); return; }

  const entries = subjects[currentSubject];
  const headers = ['Bezeichnung', 'Note', 'Gewicht'];
  const rows = entries.map(e => [
    `"${e.name.replace(/"/g, '""')}"`,
    e.grade,
    e.weight
  ]);

  const r = calcAvg(entries);
  if (r) {
    rows.push(['', '', '']);
    rows.push(['Schnitt', fmtDE(r.avg).replace('.', ','), '']);
  }

  const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `noten-${currentSubject}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportPDF() {
  if (!currentSubject || !subjects[currentSubject].length) { alert('Keine Einträge zum Exportieren.'); return; }

  const entries = subjects[currentSubject];
  const r = calcAvg(entries);
  const info = r ? gradeInfo(r.avg) : null;

  const date = new Date().toLocaleDateString('de-DE');
  const html = `
    <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px;">
      <h1 style="margin: 0 0 5px 0; font-size: 24px;">${esc(currentSubject)}</h1>
      <p style="margin: 0 0 20px 0; color: #666; font-size: 12px;">Datum: ${date}</p>

      <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
        <thead>
          <tr style="background: #eaf5ec; border-bottom: 2px solid #d6dbd5;">
            <th style="padding: 8px 12px; text-align: left; font-weight: bold; font-size: 12px;">Bezeichnung</th>
            <th style="padding: 8px 12px; text-align: center; font-weight: bold; font-size: 12px; width: 60px;">Note</th>
            <th style="padding: 8px 12px; text-align: center; font-weight: bold; font-size: 12px; width: 60px;">Gewicht</th>
          </tr>
        </thead>
        <tbody>
          ${entries.map(e => `
            <tr style="border-bottom: 1px solid #e2e8f0;">
              <td style="padding: 8px 12px; font-size: 12px;">${esc(e.name)}</td>
              <td style="padding: 8px 12px; text-align: center; font-size: 12px;">${e.grade}</td>
              <td style="padding: 8px 12px; text-align: center; font-size: 12px;">${e.weight}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>

      ${r ? `
        <div style="background: #eaf5ec; border-left: 4px solid #1f7a3d; padding: 12px; margin-top: 20px;">
          <p style="margin: 0; font-size: 11px; color: #666; font-weight: bold;">GEWICHTETER SCHNITT</p>
          <p style="margin: 8px 0 0 0; font-size: 28px; font-weight: bold; color: #0f172a;">${fmtDE(r.avg)}</p>
          <p style="margin: 4px 0 0 0; font-size: 11px; color: #666;">${r.cnt} Eintrag${r.cnt!==1?'e':''} • Gesamtgewicht ${r.tw}</p>
          <p style="margin: 8px 0 0 0; display: inline-block; padding: 4px 10px; font-size: 11px; font-weight: bold; background: ${
            info.cls === 'rc-green' ? '#dcfce7; color: #15803d' :
            info.cls === 'rc-blue' ? '#eaf5ec; color: #155c2e' :
            info.cls === 'rc-yellow' ? '#fef9c3; color: #a16207' :
            info.cls === 'rc-orange' ? '#ffedd5; color: #c2410c' :
            '#fee2e2; color: #b91c1c'
          };">${info.label}</p>
        </div>
      ` : ''}

      <p style="margin-top: 30px; font-size: 10px; color: #999; border-top: 1px solid #e2e8f0; padding-top: 10px;">Exportiert von Notenrechner • IFB</p>
    </div>
  `;

  const opt = {
    margin: 10,
    filename: `noten-${currentSubject}-${new Date().toISOString().slice(0,10)}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(html).save();
}

function importCSV() {
  document.getElementById('importFile').click();
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function handleImport(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      if (lines.length < 2) throw new Error('Invalid CSV');

      const entries = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = parseCSVLine(lines[i]);
        if (parts.length < 3) continue;

        const name = parts[0].trim();
        const grade = parts[1].trim();
        const weight = parseFloat(parts[2]);

        if (name && GKEYS.includes(grade) && !isNaN(weight) && weight > 0) {
          entries.push(newEntry(name, grade, weight));
        }
      }

      if (!currentSubject) return;
      subjects[currentSubject] = entries;
      save(); renderGrades();
    } catch { alert('Ungültige CSV-Datei.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// ─── THEME ────────────────────────────────────────────────────────────────────
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  const ic = document.getElementById('themeIcon');
  if (ic) ic.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
  if (window.lucide) lucide.createIcons();
}

document.getElementById('themeBtn').addEventListener('click', () => {
  isDark = !isDark;
  localStorage.setItem('sp-theme', isDark ? 'dark' : 'light');
  applyTheme();
});

document.getElementById('subjectNameInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addSubject();
});

document.getElementById('addSubjectModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddSubject();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddSubject();
});

// ─── CLOCK ────────────────────────────────────────────────────────────────────
const p2=n=>String(n).padStart(2,'0');
function tick(){
  const d=new Date();
  document.getElementById('clockTime').textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}
tick();setInterval(tick,1000);

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
applyTheme();
renderTabs();
renderGrades();
lucide.createIcons();
</script>

  <div class="footer-inner">
    <a href="https://github.com/simonknl/stundenplan-site" target="_blank" rel="noopener">github.com/simonknl/stundenplan-site</a>
  </div>
</footer>
