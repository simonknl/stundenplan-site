<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notenrechner · IFB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg:#f0f4f9;--surface:#fff;--surface-2:#f8fafc;--border:#e2e8f0;--border-s:#f0f4f8;
  --text:#0f172a;--text-2:#334155;--muted:#64748b;--subtle:#94a3b8;--blue:#3b82f6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --r:10px;--r-lg:14px;
}
[data-theme="dark"] {
  --bg:#0d1117;--surface:#161b27;--surface-2:#1c2333;--border:#2d3748;--border-s:#1e2a3a;
  --text:#e2e8f0;--text-2:#a0aec0;--muted:#718096;--subtle:#4a5568;--blue:#63b3ed;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 12px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-decoration:none}
.page{max-width:820px;margin:0 auto;padding:16px}
@media(min-width:768px){.page{padding:24px 32px}}

/* header */
.header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.header-title{flex:1;min-width:140px}
.header-title h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.header-title .sub{font-size:12px;color:var(--muted);margin-top:1px}
.header-actions{display:flex;align-items:center;gap:6px}
.nav-links{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:3px;box-shadow:var(--shadow-sm)}
.nav-link{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;transition:background .12s,color .12s;white-space:nowrap}
.nav-link:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav-link.active{background:var(--blue);color:#fff}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .15s,color .15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* mode tabs */
.mode-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:4px;box-shadow:var(--shadow-sm)}
.mt-btn{flex:1;padding:7px 8px;border:none;border-radius:var(--r);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;font-family:inherit;white-space:nowrap}
.mt-btn:hover{background:var(--surface-2);color:var(--text)}
.mt-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.25)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.card-head{padding:12px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-head h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1}
.card-head .chi{color:var(--subtle);flex-shrink:0}

/* preset bar */
.preset-bar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.preset-lbl{font-size:11px;font-weight:600;color:var(--subtle);white-space:nowrap;margin-right:2px}
.preset-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .12s,border-color .12s,color .12s;font-family:inherit}
.preset-btn:hover{background:var(--border-s);border-color:var(--blue);color:var(--text)}
.pw{font-size:10px;font-weight:700;color:var(--subtle);background:var(--border);border-radius:4px;padding:1px 5px}

/* grade table */
.grade-table{width:100%;border-collapse:collapse}
.grade-table th{padding:6px 8px 6px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);text-align:left;border-bottom:1px solid var(--border);background:var(--surface-2)}
.grade-table th.tc{text-align:center}
.grade-table th:last-child{width:38px;padding-right:14px;text-align:center}
.grade-table td{padding:5px 8px 5px 16px;border-bottom:1px solid var(--border-s);vertical-align:middle}
.grade-table tr:last-child td{border-bottom:none}
.grade-table tbody tr:hover td{background:var(--surface-2)}

/* inputs */
.inp{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;color:var(--text);font-family:inherit;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
select.inp{cursor:pointer;-webkit-appearance:none;appearance:none}
.inp-name{min-width:100px}
.inp-w{width:64px;text-align:center}
.inp-pts{width:64px;text-align:center}
.inp-grade{width:66px;text-align:center}

/* del button */
.del-btn{width:27px;height:27px;border:1px solid var(--border);background:transparent;border-radius:6px;cursor:pointer;color:var(--subtle);display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s,border-color .12s;margin:0 auto;flex-shrink:0}
.del-btn:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
[data-theme="dark"] .del-btn:hover{background:#450a0a;border-color:#7f1d1d;color:#f87171}

/* add row */
.add-row{padding:8px 14px;border-top:1px solid var(--border-s)}
.add-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:transparent;border:1px dashed var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .12s,border-color .12s,color .12s;font-family:inherit;width:100%}
.add-btn:hover{background:var(--surface-2);border-color:var(--blue);color:var(--blue)}

/* io bar */
.io-bar{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.io-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .12s,color .12s;font-family:inherit}
.io-btn:hover{background:var(--border);color:var(--text)}
.io-btn.danger:hover{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
[data-theme="dark"] .io-btn.danger:hover{background:#450a0a;color:#f87171;border-color:#7f1d1d}

/* result card */
.result-wrap{display:flex;align-items:stretch;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.result-main{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px 20px}
.result-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle);margin-bottom:4px}
.result-val{font-size:38px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.result-sub{font-size:12px;color:var(--muted);margin-top:5px}
.result-tag{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-top:10px}
.rc-green{color:#15803d;background:#dcfce7}
.rc-blue{color:#1d4ed8;background:#dbeafe}
.rc-yellow{color:#a16207;background:#fef9c3}
.rc-orange{color:#c2410c;background:#ffedd5}
.rc-red{color:#b91c1c;background:#fee2e2}
[data-theme="dark"] .rc-green{color:#4ade80;background:#052e16}
[data-theme="dark"] .rc-blue{color:#93c5fd;background:#172554}
[data-theme="dark"] .rc-yellow{color:#fde047;background:#422006}
[data-theme="dark"] .rc-orange{color:#fb923c;background:#431407}
[data-theme="dark"] .rc-red{color:#f87171;background:#450a0a}

/* empty state */
.empty-state{padding:36px 18px;text-align:center}
.empty-state .es-title{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.empty-state p{font-size:12px;color:var(--subtle)}

/* oberstufe section header */
.ob-head{padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ob-head-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle)}
.ob-badge{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--border);color:var(--muted)}

/* ziel panel */
.ziel-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ziel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ziel-lbl{font-size:13px;color:var(--text-2);flex:1;min-width:180px}
.ziel-src{font-size:12px;color:var(--muted);padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-bottom:4px}
.ziel-result{padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r)}
.zr-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);margin-bottom:3px}
.zr-val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.zr-sub{font-size:12px;color:var(--muted);margin-top:3px}

/* panel visibility */
.panel{display:none}
.panel.active{display:block}

/* points display badge in ob result */
.pts-result{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px 18px;text-align:center}
.pts-result-val{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.pts-result-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle);margin-bottom:3px}
.pts-result-sub{font-size:12px;color:var(--muted);margin-top:4px}

@media(max-width:560px){
  .nav-links{display:none}
  .subject-tabs{gap:0}
  .subject-tab{font-size:12px;padding:0 10px}
  .grade-table th,.grade-table td{padding-left:10px}
  .preset-bar{gap:4px}
  .preset-btn{font-size:11px;padding:3px 8px}
}

.subject-tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:2px;box-shadow:var(--shadow-sm);overflow-x:auto;align-items:center}
.subject-tab{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;font-family:inherit;white-space:nowrap}
.subject-tab:hover{background:var(--surface-2);color:var(--text)}
.subject-tab.active{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.25)}
.subject-tab.add-subject{padding:0 10px;border:1px dashed var(--border);margin-left:auto}
.subject-tab.add-subject:hover{border-color:var(--blue);color:var(--blue)}
.subject-tab.create-hint{font-style:italic;border:1px dashed var(--border)}
.subject-tab.create-hint:hover{border-color:var(--blue);color:var(--blue)}
.tab-del{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:2px;border-radius:3px;font-size:15px;line-height:1;opacity:.5}
.subject-tab.active .tab-del:hover{opacity:1;background:rgba(255,255,255,.2)}
.subject-tab:not(.active) .tab-del:hover{opacity:1;background:rgba(0,0,0,.09)}
[data-theme=dark] .subject-tab:not(.active) .tab-del:hover{background:rgba(255,255,255,.1)}

.overall-mini{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:8px;box-shadow:var(--shadow-sm)}
.overall-mini-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle)}
.overall-mini-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.overall-mini-sub{font-size:11px;color:var(--muted);margin-left:auto}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-box{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px;max-width:400px;width:90%}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px}
.modal-input{width:100%;margin-bottom:16px}
.modal-buttons{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
.modal-btn:hover{background:var(--border)}
.modal-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.modal-btn.primary:hover{background:#2563eb}
footer{text-align:center;padding:20px 0 16px;font-size:11px;color:var(--subtle)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="page">

<div class="header">
  <div class="header-title">
    <h1>Notenrechner</h1>
    <div class="sub">IFB</div>
  </div>
  <div class="header-actions">
    <nav class="nav-links">
      <a class="nav-link" href="stundenplan.html">Stundenplan</a>
      <a class="nav-link" href="klausurenplan.html">Klausurenplan</a>
      <a class="nav-link active" href="notenrechner.html">Notenrechner</a>
    </nav>
    <button class="icon-btn" id="themeBtn" title="Theme wechseln">
      <i data-lucide="sun" style="width:15px;height:15px" id="themeIcon"></i>
    </button>
  </div>
</div>

<div class="subject-tabs" id="subjectTabs"></div>

<div class="card">
  <div class="card-head">
    <i data-lucide="list" style="width:14px;height:14px" class="chi"></i>
    <h2 id="subjectTitle">Fach</h2>
  </div>
  <div class="preset-bar">
    <span class="preset-lbl">Hinzufügen:</span>
    <button class="preset-btn" onclick="addPreset('Schulaufgabe',2)">Schulaufgabe <span class="pw">2×</span></button>
    <button class="preset-btn" onclick="addPreset('Ex',1)">Ex <span class="pw">1×</span></button>
    <button class="preset-btn" onclick="addPreset('Mündlich',1)">Mündlich <span class="pw">1×</span></button>
    <button class="preset-btn" onclick="addPreset('Kurzarbeit',1.5)">Kurzarbeit <span class="pw">1,5×</span></button>
    <button class="preset-btn" onclick="addPreset('Referat',1)">Referat <span class="pw">1×</span></button>
  </div>
  <table class="grade-table">
    <thead>
      <tr>
        <th>Bezeichnung</th>
        <th class="tc" style="width:74px">Note</th>
        <th class="tc" style="width:70px">Gewicht</th>
        <th style="width:38px"></th>
      </tr>
    </thead>
    <tbody id="gradeBody"></tbody>
  </table>
  <div class="add-row">
    <button class="add-btn" onclick="addEntry()">
      <i data-lucide="plus" style="width:13px;height:13px"></i>
      Eintrag hinzufügen
    </button>
  </div>
  <div class="io-bar">
    <button class="io-btn" onclick="exportCSV()"><i data-lucide="download" style="width:12px;height:12px"></i> CSV</button>
    <button class="io-btn" onclick="exportPDF()"><i data-lucide="download" style="width:12px;height:12px"></i> PDF</button>
    <button class="io-btn" onclick="importCSV()"><i data-lucide="upload" style="width:12px;height:12px"></i> Import</button>
    <button class="io-btn danger" style="margin-left:auto" onclick="removeSub()"><i data-lucide="trash-2" style="width:12px;height:12px"></i> Fach löschen</button>
  </div>
</div>

<div id="resultWrap"></div>
<div id="overallResult"></div>

</div><!-- .page -->

<input type="file" id="importFile" accept=".csv" style="display:none" onchange="handleImport(event)">

<div class="modal" id="addSubjectModal">
  <div class="modal-box">
    <div class="modal-title">Neues Fach erstellen</div>
    <input type="text" class="inp modal-input" id="subjectNameInput" placeholder="z.B. Deutsch, Mathematik, Englisch...">
    <div class="modal-buttons">
      <button class="modal-btn" onclick="closeAddSubject()">Abbrechen</button>
      <button class="modal-btn primary" onclick="addSubject()">Erstellen</button>
    </div>
  </div>
</div>

<script>
// ─── GRADE SYSTEM ─────────────────────────────────────────────────────────────
const G = {'1': 1.0, '2': 2.0, '3': 3.0, '4': 4.0, '5': 5.0, '6': 6.0};
const GKEYS = ['1', '2', '3', '4', '5', '6'];

function gradeInfo(avg) {
  if (avg <= 1.5) return { label: 'sehr gut',       cls: 'rc-green'  };
  if (avg <= 2.5) return { label: 'gut',             cls: 'rc-blue'   };
  if (avg <= 3.5) return { label: 'befriedigend',    cls: 'rc-yellow' };
  if (avg <= 4.5) return { label: 'ausreichend',     cls: 'rc-orange' };
  if (avg <= 5.5) return { label: 'mangelhaft',      cls: 'rc-red'    };
  return                  { label: 'ungenügend',     cls: 'rc-red'    };
}

function fmtDE(n, d=2) { return n.toFixed(d).replace('.', ','); }
function esc(s)         { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── STATE ────────────────────────────────────────────────────────────────────
let nid = 1;
let subjects = {};
let currentSubject = null;
let isDark = localStorage.getItem('nr-theme') === 'dark';

// ─── CALC ─────────────────────────────────────────────────────────────────────
function calcAvg(entries) {
  let sum = 0, tw = 0, cnt = 0;
  for (const e of entries) {
    const g = G[e.grade];
    const w = parseFloat(e.weight);
    if (g != null && !isNaN(w) && w > 0) { sum += g * w; tw += w; cnt++; }
  }
  return tw > 0 ? { avg: sum / tw, tw, cnt } : null;
}

function calcOverall() {
  let averages = [];
  for (const [subj, entries] of Object.entries(subjects)) {
    const r = calcAvg(entries);
    if (r) averages.push(r.avg);
  }
  if (averages.length === 0) return null;
  const avg = averages.reduce((a, b) => a + b, 0) / averages.length;
  return { avg, cnt: averages.length };
}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('nr-subjects', JSON.stringify(subjects));
  localStorage.setItem('nr-current', currentSubject);
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('nr-subjects') || '{}');
    subjects = typeof s === 'object' && !Array.isArray(s) ? s : {};
    
    // no default subject — start empty
    
    for (const key in subjects) {
      if (!Array.isArray(subjects[key])) subjects[key] = [];
    }
    
    const ids = [];
    for (const entries of Object.values(subjects)) {
      ids.push(...entries.map(x => x.id || 0));
    }
    nid = ids.length ? Math.max(...ids) + 1 : 1;
    
    currentSubject = localStorage.getItem('nr-current');
    if (!currentSubject || !subjects[currentSubject]) {
      currentSubject = Object.keys(subjects)[0];
    }
  } catch {
    subjects = { 'Fach': [] };
    currentSubject = 'Fach';
  }
}

// ─── GRADE SELECT HTML ────────────────────────────────────────────────────────
function gradeSelect(val, id) {
  const opts = GKEYS.map(k => `<option value="${k}"${k===val?' selected':''}>${k}</option>`).join('');
  return `<select class="inp inp-grade" data-id="${id}" onchange="upd(${id},'grade',this.value)">${opts}</select>`;
}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function renderTabs() {
  const div = document.getElementById('subjectTabs');
  const keys = Object.keys(subjects);
  if (keys.length === 0) {
    div.innerHTML = `<button class="subject-tab create-hint" onclick="openAddSubject()"><i data-lucide="plus" style="width:13px;height:13px"></i> Fach erstellen</button>`;
    lucide.createIcons();
    return;
  }
  const tabs = keys.map(subj =>
    `<button class="subject-tab${subj === currentSubject ? ' active' : ''}" onclick="switchSubject(this.dataset.s)" data-s="${esc(subj)}">${esc(subj)}<span class="tab-del" data-del="${esc(subj)}" onclick="event.stopPropagation();removeSub(this.dataset.del)" title="Fach löschen">×</span></button>`
  ).join('');
  div.innerHTML = tabs + `<button class="subject-tab add-subject" onclick="openAddSubject()" title="Neues Fach hinzufügen"><i data-lucide="plus" style="width:14px;height:14px"></i></button>`;
  lucide.createIcons();
}

function renderGrades() {
  const tb = document.getElementById('gradeBody');
  const entries = subjects[currentSubject] || [];
  document.getElementById('subjectTitle').textContent = currentSubject || '–';
  
  if (!entries.length) {
    tb.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="es-title">Noch keine Einträge</div><p>Wähle einen Preset unten oder füge manuell eine Note hinzu.</p></div></td></tr>`;
    document.getElementById('resultWrap').innerHTML = '';
    return;
  }
  
  tb.innerHTML = entries.map(e => `
    <tr>
      <td><input class="inp inp-name" type="text" value="${esc(e.name)}" placeholder="Fach / Bezeichnung" oninput="upd(${e.id},'name',this.value)"></td>
      <td>${gradeSelect(e.grade, e.id)}</td>
      <td><input class="inp inp-w" type="number" value="${e.weight}" min="0.5" max="10" step="0.5" onchange="upd(${e.id},'weight',this.value)" oninput="upd(${e.id},'weight',this.value)"></td>
      <td><button class="del-btn" onclick="removeEntry(${e.id})" title="Löschen"><i data-lucide="x" style="width:11px;height:11px"></i></button></td>
    </tr>`).join('');
  lucide.createIcons();
  renderResult();
}

function renderResult() {
  const wrap = document.getElementById('resultWrap');
  const entries = subjects[currentSubject] || [];
  const r = calcAvg(entries);
  if (!r) { wrap.innerHTML = ''; renderOverall(); return; }
  const info = gradeInfo(r.avg);
  wrap.innerHTML = `
    <div class="result-main">
      <div class="result-label">Gewichteter Schnitt</div>
      <div class="result-val">${fmtDE(r.avg)}</div>
      <div class="result-sub">${r.cnt} Eintrag${r.cnt!==1?'e':''} &middot; Gesamtgewicht ${r.tw % 1 === 0 ? r.tw : fmtDE(r.tw)}</div>
      <div class="result-tag ${info.cls}">${info.label}</div>
    </div>`;
  renderOverall();
}

function renderOverall() {
  const div = document.getElementById('overallResult');
  const r = calcOverall();
  if (!r) { div.innerHTML = ''; return; }
  const info = gradeInfo(r.avg);
  div.innerHTML = `
    <div class="overall-mini">
      <span class="overall-mini-lbl">Gesamtschnitt</span>
      <span class="overall-mini-val">${fmtDE(r.avg)}</span>
      <span class="result-tag ${info.cls}" style="margin:0;padding:3px 10px;font-size:11px">${info.label}</span>
      <span class="overall-mini-sub">${r.cnt} ${r.cnt !== 1 ? 'Fächer' : 'Fach'}</span>
    </div>`;
}

// ─── ENTRY MUTATIONS ──────────────────────────────────────────────────────────
function newEntry(name, grade, weight) {
  return { id: nid++, name: name || '', grade: grade || '2', weight: weight || 1 };
}

function addEntry(name, grade, weight) {
  if (!currentSubject) return;
  subjects[currentSubject].push(newEntry(name, grade, weight));
  save(); renderGrades();
}

function addPreset(name, weight) {
  addEntry(name, '2', weight);
}

function removeEntry(id) {
  if (!currentSubject) return;
  subjects[currentSubject] = subjects[currentSubject].filter(e => e.id !== id);
  save(); renderGrades();
}

function upd(id, field, val) {
  if (!currentSubject) return;
  const e = subjects[currentSubject].find(e => e.id === id);
  if (!e) return;
  if (field === 'weight') { const w = parseFloat(val); if (!isNaN(w) && w > 0) e.weight = w; }
  else e[field] = val;
  save(); renderResult();
}

// ─── SUBJECT MUTATIONS ─────────────────────────────────────────────────────────
function openAddSubject() {
  document.getElementById('addSubjectModal').classList.add('active');
  document.getElementById('subjectNameInput').value = '';
  document.getElementById('subjectNameInput').focus();
}

function closeAddSubject() {
  document.getElementById('addSubjectModal').classList.remove('active');
}

function addSubject() {
  const name = document.getElementById('subjectNameInput').value.trim();
  if (!name) return;
  if (subjects[name]) { alert('Fach existiert bereits!'); return; }
  subjects[name] = [];
  save();
  switchSubject(name);
  closeAddSubject();
}

function switchSubject(name) {
  if (!subjects[name]) return;
  currentSubject = name;
  save();
  document.getElementById('subjectTitle').textContent = name;
  renderTabs();
  renderGrades();
}

function removeSub(name) {
  const target = name !== undefined ? name : currentSubject;
  if (!target || !subjects[target]) return;
  if (!confirm(`Fach "${target}" wirklich löschen?`)) return;
  delete subjects[target];
  if (currentSubject === target) currentSubject = Object.keys(subjects)[0] || null;
  save();
  renderTabs();
  if (currentSubject) switchSubject(currentSubject);
  else { renderGrades(); renderOverall(); }
}

// ─── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function exportCSV() {
  if (!currentSubject || !subjects[currentSubject].length) { alert('Keine Einträge zum Exportieren.'); return; }
  
  const entries = subjects[currentSubject];
  const headers = ['Bezeichnung', 'Note', 'Gewicht'];
  const rows = entries.map(e => [
    `"${e.name.replace(/"/g, '""')}"`,
    e.grade,
    e.weight
  ]);
  
  const r = calcAvg(entries);
  if (r) {
    rows.push(['', '', '']);
    rows.push(['Schnitt', fmtDE(r.avg).replace('.', ','), '']);
  }
  
  const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `noten-${currentSubject}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportPDF() {
  if (!currentSubject || !subjects[currentSubject].length) { alert('Keine Einträge zum Exportieren.'); return; }
  
  const entries = subjects[currentSubject];
  const r = calcAvg(entries);
  const info = r ? gradeInfo(r.avg) : null;
  
  const date = new Date().toLocaleDateString('de-DE');
  const html = `
    <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px;">
      <h1 style="margin: 0 0 5px 0; font-size: 24px;">${esc(currentSubject)}</h1>
      <p style="margin: 0 0 20px 0; color: #666; font-size: 12px;">Datum: ${date}</p>
      
      <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
        <thead>
          <tr style="background: #f0f4f9; border-bottom: 2px solid #e2e8f0;">
            <th style="padding: 8px 12px; text-align: left; font-weight: bold; font-size: 12px;">Bezeichnung</th>
            <th style="padding: 8px 12px; text-align: center; font-weight: bold; font-size: 12px; width: 60px;">Note</th>
            <th style="padding: 8px 12px; text-align: center; font-weight: bold; font-size: 12px; width: 60px;">Gewicht</th>
          </tr>
        </thead>
        <tbody>
          ${entries.map(e => `
            <tr style="border-bottom: 1px solid #e2e8f0;">
              <td style="padding: 8px 12px; font-size: 12px;">${e.name}</td>
              <td style="padding: 8px 12px; text-align: center; font-size: 12px;">${e.grade}</td>
              <td style="padding: 8px 12px; text-align: center; font-size: 12px;">${e.weight}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      
      ${r ? `
        <div style="background: #f0f4f9; border-left: 4px solid #3b82f6; padding: 12px; margin-top: 20px; border-radius: 4px;">
          <p style="margin: 0; font-size: 11px; color: #666; font-weight: bold;">GEWICHTETER SCHNITT</p>
          <p style="margin: 8px 0 0 0; font-size: 28px; font-weight: bold; color: #0f172a;">${fmtDE(r.avg)}</p>
          <p style="margin: 4px 0 0 0; font-size: 11px; color: #666;">${r.cnt} Eintrag${r.cnt!==1?'e':''} • Gesamtgewicht ${r.tw}</p>
          <p style="margin: 8px 0 0 0; display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; background: ${
            info.cls === 'rc-green' ? '#dcfce7; color: #15803d' :
            info.cls === 'rc-blue' ? '#dbeafe; color: #1d4ed8' :
            info.cls === 'rc-yellow' ? '#fef9c3; color: #a16207' :
            info.cls === 'rc-orange' ? '#ffedd5; color: #c2410c' :
            '#fee2e2; color: #b91c1c'
          };">${info.label}</p>
        </div>
      ` : ''}
      
      <p style="margin-top: 30px; font-size: 10px; color: #999; border-top: 1px solid #e2e8f0; padding-top: 10px;">Exportiert von Notenrechner • IFB</p>
    </div>
  `;
  
  const opt = {
    margin: 10,
    filename: `noten-${currentSubject}-${new Date().toISOString().slice(0,10)}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  
  html2pdf().set(opt).from(html).save();
}

function importCSV() {
  document.getElementById('importFile').click();
}

function handleImport(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      if (lines.length < 2) throw new Error('Invalid CSV');
      
      const entries = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length < 3) continue;
        
        const name = parts[0].replace(/^"|"$/g, '').replace('""', '"');
        const grade = parts[1].trim();
        const weight = parseFloat(parts[2]);
        
        if (name && grade && !isNaN(weight) && weight > 0) {
          entries.push(newEntry(name, grade, weight));
        }
      }
      
      if (!currentSubject) return;
      subjects[currentSubject] = entries;
      save(); renderGrades();
    } catch { alert('Ungültige CSV-Datei.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// ─── THEME ────────────────────────────────────────────────────────────────────
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  const ic = document.getElementById('themeIcon');
  if (ic) ic.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
  if (window.lucide) lucide.createIcons();
}

document.getElementById('themeBtn').addEventListener('click', () => {
  isDark = !isDark;
  localStorage.setItem('nr-theme', isDark ? 'dark' : 'light');
  applyTheme();
});

document.getElementById('subjectNameInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addSubject();
});

document.getElementById('addSubjectModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddSubject();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddSubject();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
applyTheme();
renderTabs();
renderGrades();
lucide.createIcons();
</script>
