[data-theme="dark"] {
  --bg:#0a0e27;--surface:#161b27;--surface-2:#1c2333;--border:#2d3748;--border-s:#1e2a3a;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;font-size:var(--fs-base);line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.page{max-width:900px;margin:0 auto;padding:var(--sp-lg)}
@media(min-width:768px){.page{padding:var(--sp-xl) var(--sp-2xl)}}

.header{display:flex;align-items:center;gap:var(--sp-lg);margin-bottom:var(--sp-lg);flex-wrap:wrap}
.header-title{flex:1;min-width:160px}
.header-title h1{font-size:var(--fs-2xl);font-weight:900;letter-spacing:-.5px;line-height:1.2}
.header-title .sub{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-xs)}
.header-actions{display:flex;align-items:center;gap:var(--sp-md)}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background 150ms,color 150ms;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.class-tabs{display:flex;gap:var(--sp-sm);margin-bottom:var(--sp-lg);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-sm);box-shadow:none;flex-wrap:wrap}
.ct-btn{flex:1;min-width:60px;padding:var(--sp-md) var(--sp-md);border:none;border-radius:var(--r-md);background:transparent;color:var(--muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:background 150ms,color 150ms;font-family:inherit;white-space:nowrap}
.ct-btn:hover{background:var(--surface-2);color:var(--text)}
.ct-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.2)}

.layout{display:flex;flex-direction:column;gap:var(--sp-lg)}
@media(min-width:800px){.layout{flex-direction:row;align-items:flex-start}.main-col{flex:1;min-width:0}.side-col{width:280px;flex-shrink:0}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:none;overflow:hidden}
.card-head{padding:var(--sp-lg) var(--sp-xl) var(--sp-md);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-md)}
.card-head h2{font-size:var(--fs-sm);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--muted)}
.card-head .chi{color:var(--subtle)}

.nex-body{padding:var(--sp-lg) var(--sp-xl)}
.nex-ey{font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--subtle);margin-bottom:var(--sp-md)}
.nex-subj{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px}
.nex-date{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-md)}
.nex-badge{display:inline-flex;align-items:center;border-radius:999px;padding:var(--sp-xs) var(--sp-lg);font-size:var(--fs-sm);font-weight:700;margin-top:var(--sp-lg)}

.nb-norm{background:#eff6ff;color:#2563eb}.nb-ap{background:#f0fdf4;color:#16a34a}
[data-theme="dark"] .nb-today{background:#450a0a;color:#f87171}
[data-theme="dark"] .nb-soon{background:#451a03;color:#fbbf24}
[data-theme="dark"] .nb-norm{background:#172554;color:#93c5fd}
[data-theme="dark"] .nb-ap{background:#052e16;color:#4ade80}

.ex-mhdr{padding:var(--sp-md) var(--sp-xl) var(--sp-xs);font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--subtle);background:var(--surface-2);border-top:1px solid var(--border)}

.ex-row{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-xl);border-top:1px solid var(--border-s);transition:background 150ms}
.ex-row:hover{background:var(--surface-2)}
.ex-row.past{opacity:.35}
.ex-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);flex-shrink:0}
.ex-date{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--muted);width:76px;flex-shrink:0;line-height:1.35}
.ex-date-day{font-size:var(--fs-xs);color:var(--subtle);display:block}
.ex-subj{flex:1;font-weight:600;font-size:var(--fs-sm);color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-type{font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:.04em;color:var(--subtle);flex-shrink:0;white-space:nowrap}
.ex-badge{font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:2px 8px;flex-shrink:0}
.eb-today{background:#fee2e2;color:#dc2626}
.eb-soon{background:#fef3c7;color:#d97706}

[data-theme="dark"] .ex-ferien{color:#4ade80;background:#052e16;border-color:#166534}
.tod-empty{padding:var(--sp-lg) var(--sp-xl);font-size:var(--fs-sm);color:var(--muted);text-align:center}

.sc-java   {--sc:#7c3aed}.sc-linux  {--sc:#0891b2}.sc-acc    {--sc:#a855f7}.sc-bwl    {--sc:#1e40af}

.ex-row.subj-hi{outline:2px solid var(--sc);outline-offset:-2px;z-index:2}

#examTip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0;box-shadow:var(--shadow);font-size:var(--fs-sm);z-index:1000;min-width:210px;max-width:260px;max-height:380px;overflow-y:auto;display:none}

.etp-name{font-size:var(--fs-base);font-weight:700;margin-bottom:var(--sp-md)}

.etp-sep{border:none;border-top:1px solid var(--border);margin:0}
.etp-item{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-lg);border-top:1px solid var(--border-s);font-size:var(--fs-xs)}

.etp-ilbl{flex:1;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etp-ibadge{font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:1px 6px;flex-shrink:0}
footer{text-align:center;padding:var(--sp-xl) 0 var(--sp-lg);font-size:var(--fs-xs);color:var(--subtle)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}

</head>

const p2=n=>String(n).padStart(2,'0');
const DWS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DWK=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MNS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function todayMid(){const d=new Date();d.setHours(0,0,0,0);return d}
function daysUntil(s){return Math.round((parseD(s)-todayMid())/86400000)}
function fmtDateShort(d){return p2(d.getDate())+'. '+MNS[d.getMonth()]}
function fmtDateDay(d){return DWS[d.getDay()]}

let isDark=localStorage.getItem('sp-theme')==='dark';
let selCls=localStorage.getItem('sp-class')||'info1';

function applyTheme(){
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  const ic=document.getElementById('themeIcon');
  if(ic)ic.setAttribute('data-lucide',isDark?'sun':'moon');
  if(window.lucide)lucide.createIcons();
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  isDark=!isDark;localStorage.setItem('sp-theme',isDark?'dark':'light');applyTheme();
});

document.getElementById('classTabs').addEventListener('click',e=>{
  const btn=e.target.closest('[data-cls]');if(!btn)return;
  selCls=btn.dataset.cls;localStorage.setItem('sp-class',selCls);
  document.querySelectorAll('.ct-btn').forEach(b=>b.classList.toggle('active',b.dataset.cls===selCls));
  renderAll();
});
document.querySelectorAll('.ct-btn').forEach(b=>b.classList.toggle('active',b.dataset.cls===selCls));

function renderNex(){
  const exams=EXAMS[selCls];
  const el=document.getElementById('nexBody');
  if(!exams){el.innerHTML='<div class="tod-empty">Kein Plan für diese Klasse</div>';return;}
  const today=todayMid();
  let next=null;
  for(const ex of exams){const d=parseD(ex.date);if(d>=today){next={...ex,days:daysUntil(ex.date)};break;}}
  if(!next){el.innerHTML='<div class="tod-empty">Keine weiteren Klausuren</div>';return;}
  const m=sm(next.s);
  const d=parseD(next.date);
  let bc,bt;
  if(next.t==='Zeugnis'){bc='nb-ap';bt='Zeugnis';}
  else if(next.t==='AP'){bc='nb-ap';bt='AP';}
  else if(next.days===0){bc='nb-today';bt='HEUTE';}
  else if(next.days===1){bc='nb-soon';bt='Morgen';}
  else if(next.days<=4){bc='nb-soon';bt='in '+next.days+' Tagen';}
  else{bc='nb-norm';bt='in '+next.days+' Tagen';}
  const fullDate=`${DWS[d.getDay()]}, ${d.getDate()}. ${MN[d.getMonth()]} ${d.getFullYear()}`;
  const countdown=next.days===0?'Heute':next.days===1?'Morgen':'in '+next.days+' Tagen';
  el.innerHTML=`<div class="nex-body"><div class="nex-ey">${next.t==='AP'?'Abschlussprüfung':next.t}</div><div class="nex-subj ${m.c}" style="color:var(--sc)">${next.l}</div><div class="nex-date">${fullDate}</div><div style="display:flex;align-items:center;gap:8px;margin-top:9px"><div class="nex-badge ${bc}" style="margin:0">${countdown}</div></div></div>`;
}

function renderExams(){
  const exams=EXAMS[selCls];
  const el=document.getElementById('examList');
  if(!exams){el.innerHTML='<div class="ex-empty">Klausurenplan für diese Klasse nicht verfügbar</div>';return;}
  const today=todayMid();
  let html='',curM='',feriIdx=0,prevD=null;
  for(const ex of exams){
    const d=parseD(ex.date);
    const mo=MN[d.getMonth()]+' '+d.getFullYear();
    const days=daysUntil(ex.date);
    const past=d<today;
    const m=sm(ex.s);
    if(mo!==curM){curM=mo;html+=`<div class="ex-mhdr">${mo}</div>`;}
    while(feriIdx<FERIEN.length){
      const fs=parseD(FERIEN[feriIdx].s);
      if(fs>d)break;
      if(!prevD||fs>prevD){
        const fe=parseD(FERIEN[feriIdx].e);
        html+=`<div class="ex-ferien">☀ ${FERIEN[feriIdx].name} · bis ${fe.getDate()}. ${MNS[fe.getMonth()]}</div>`;
      }
      feriIdx++;
    }
    prevD=d;
    let bc,bt;
    if(ex.t==='Zeugnis'){bc='eb-zg';bt='Zeugnis';}
    else if(ex.t==='AP'){bc='eb-ap';bt='AP';}
    else if(past){bc='eb-fut';bt='vorbei';}
    else if(days===0){bc='eb-today';bt='HEUTE';}
    else if(days<=3){bc='eb-soon';bt=days===1?'morgen':'in '+days+' T.';}
    else{bc='eb-fut';bt='in '+days+' T.';}
    const typLbl = ex.t === 'Klausur' ? 'Klausur' : ex.t === 'AP' ? 'Abschlussprüfung' : ex.t;
    html+=`<div class="ex-row${past?' past':''} ${m.c}" data-s="${ex.s}" data-date="${ex.date}"><div class="ex-dot"></div><div class="ex-date"><span class="ex-date-day">${fmtDateDay(d)}</span>${fmtDateShort(d)}</div><div class="ex-subj">${ex.l}</div><div class="ex-type">${typLbl}</div><div class="ex-badge ${bc}">${bt}</div></div>`;
  }
  el.innerHTML=html;
}

function renderAll(){renderNex();renderExams();}

// ─── TOOLTIP + HIGHLIGHT (wie Stundenplan) ───────────────────────────────────
let activeSubj = null;

function highlightSubj(s) {
  document.querySelectorAll('.ex-row').forEach(r => {
    if (r.dataset.s === s) r.classList.add('subj-hi');
    else r.classList.add('subj-dim');
  });
}
function clearHighlight() {
  activeSubj = null;
  document.querySelectorAll('.ex-row').forEach(r => r.classList.remove('subj-hi','subj-dim'));
}
function hideTip() { document.getElementById('examTip').classList.remove('vis'); }

function showTip(row, subj, date) {
  const exams = EXAMS[selCls] || [];
  const m = sm(subj);
  const teacher = (TEACHERS[selCls] || {})[subj] || '–';
  const today = todayMid();
  const subjExams = exams.filter(e => e.s === subj);

  let itemsHtml = '';
  for (const ex of subjExams) {
    const d = parseD(ex.date);
    const days = daysUntil(ex.date);
    const past = d < today;
    const isCur = ex.date === date;
    let bc, bt;
    if (ex.t === 'AP')           { bc = 'eb-ap';    bt = 'AP'; }
    else if (ex.t === 'Zeugnis') { bc = 'eb-zg';    bt = 'Zeugnis'; }
    else if (past)               { bc = 'eb-fut';   bt = 'vorbei'; }
    else if (days === 0)         { bc = 'eb-today'; bt = 'HEUTE'; }
    else if (days <= 3)          { bc = 'eb-soon';  bt = days===1?'morgen':'in '+days+' T.'; }
    else                         { bc = 'eb-fut';   bt = 'in '+days+' T.'; }
    itemsHtml += `<div class="etp-item${past?' is-past':''}${isCur?' is-cur':''}"><span class="etp-idate">${DWK[d.getDay()]} ${fmtDateShort(d)}</span><span class="etp-ilbl">${ex.l}</span><span class="etp-ibadge ${bc}">${bt}</span></div>`;
  }

  const tip = document.getElementById('examTip');
  tip.innerHTML = `<div class="etp-head"><div class="etp-name ${m.c}" style="color:var(--sc)">${m.l}</div><div class="etp-row">Lehrer · ${teacher}</div><div class="etp-row">Zeit · 08:00 Uhr</div></div><hr class="etp-sep">${itemsHtml}`;

  const rect = row.getBoundingClientRect();
  let left = rect.right + 8, top = rect.top;
  if (left + 268 > window.innerWidth - 10) left = rect.left - 276;
  if (left < 8) left = 8;
  if (top + 400 > window.innerHeight - 10) top = window.innerHeight - 408;
  if (top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.classList.add('vis');
}

document.getElementById('examList').addEventListener('click', e => {
  const row = e.target.closest('.ex-row');
  if (!row) { clearHighlight(); hideTip(); return; }
  const subj = row.dataset.s;
  if (subj === activeSubj) { clearHighlight(); hideTip(); return; }
  clearHighlight();
  activeSubj = subj;
  highlightSubj(subj);
  showTip(row, subj, row.dataset.date);
});

document.addEventListener('click', e => {
  if (!e.target.closest('#examList') && !e.target.closest('#examTip')) {
    clearHighlight(); hideTip();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { clearHighlight(); hideTip(); } });

applyTheme();
renderAll();
lucide.createIcons();
</script>
